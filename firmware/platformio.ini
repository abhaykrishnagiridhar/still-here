; Flat layout: sources and headers sit next to this file.
[platformio]
src_dir = .
include_dir = .

; One board does everything: the ESP32-S3 N16R8 with the built-in camera socket.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; ESP32-S3 N16R8: 16 MB flash, 8 MB octal PSRAM
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; WebSockets only finds the framework's WiFi headers when told where they are
    -I"${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src"
    -I"${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFiClientSecure/src"

; The test_*.cpp files are PC-side tests with their own main() (see CMakeLists.txt): never build
; them into the board firmware
build_src_filter = +<*> -<test_*.cpp>

; Scan libraries fully, so the Adafruit libraries find the framework's SPI and Wire
; even before main.cpp includes them.
lib_ldf_mode = deep+

lib_deps =
    adafruit/Adafruit PWM Servo Driver Library
    adafruit/DHT sensor library
    links2004/WebSockets
