; Flat layout: sources and headers sit next to this file.
[platformio]
src_dir = .
include_dir = .

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; ESP32-S3 N16R8: 16 MB flash, 8 MB octal PSRAM
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; WebSockets only finds the framework's WiFi headers when told where they are
    -I"${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src"
    -I"${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFiClientSecure/src"

; cam_*.cpp files are for the ESP32-CAM only and never build into the S3
build_src_filter = +<*> -<cam_*.cpp>

; Scan libraries fully, so the Adafruit libraries find the framework's SPI and Wire
; even before main.cpp includes them.
lib_ldf_mode = deep+

lib_deps =
    adafruit/Adafruit PWM Servo Driver Library
    adafruit/DHT sensor library
    links2004/WebSockets

; AI-Thinker ESP32-CAM (OV2640) on the ESP32-CAM-MB USB base. The camera driver
; comes with the Arduino core, so no extra library is needed. It builds the small
; placeholder cam_boot.cpp for now; cam_stream.cpp will replace it (then add
; -<cam_boot.cpp> to the filter below).
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
build_src_filter = +<*> -<main.cpp>
