; Flat layout: sources and headers sit next to this file.
[platformio]
src_dir = .
include_dir = .

; One board does everything: the ESP32-S3 N16R8 with the built-in camera socket.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; ESP32-S3 N16R8: 16 MB flash, 8 MB octal PSRAM
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial text goes to the UART port (the board's CH343 USB-serial chip, the COM port you flash through).
    ; Set this to 1 to send it to the board's native USB port instead.
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; WebSockets only finds the framework's WiFi headers when told where they are
    -I"${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src"
    -I"${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFiClientSecure/src"

; The test_*.cpp files are PC-side tests with their own main() (see CMakeLists.txt): never build
; them into the board firmware
build_src_filter = +<*> -<test_*.cpp> -<diag_main.cpp> -<rover_arm_ap.cpp>

; Scan libraries fully, so the Adafruit libraries find the framework's SPI and Wire
; even before main.cpp includes them.
lib_ldf_mode = deep+

lib_deps =
    adafruit/Adafruit PWM Servo Driver Library
    adafruit/DHT sensor library
    links2004/WebSockets

; The Manual tab's backend: the rover makes its own Wi-Fi (ROVER_ARM) and answers plain HTTP
; (see rover_arm_ap.cpp and laptop/control.ts). Classic ESP32 pins, not the S3 camera board.
;   python -m platformio run -d firmware -e rover_arm -t upload
[env:rover_arm]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<rover_arm_ap.cpp>
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library

; A tiny program that only prints a boot report, to find out why the real one does not start.
; Build and upload it with:  python -m platformio run -d firmware -e diag -t upload
[env:diag]
extends = env:esp32s3
build_src_filter = -<*> +<diag_main.cpp>

