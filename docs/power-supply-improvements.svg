<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img" aria-labelledby="t d">
  <title id="t">Two-supply power blueprint for the rover</title>
  <desc id="d">A power bank feeds only the ESP32-S3. A 2S 18650 pack goes through protection to a 6.0V buck for the servos and straight to the motor driver for the drive motors. The ESP32 sends I2C to the PCA9685 and PWM to the motor driver. The grounds of the two supplies are joined at one point.</desc>
  <style>
    text { font-family: "Hanken Grotesk", Inter, Arial, Helvetica, sans-serif; }
    .lab { font-size: 12px; fill: #b4b2a9; }
    .th { font-size: 14px; font-weight: 600; }
    .ts { font-size: 12px; }
    .arr { stroke: #9a9a9a; stroke-width: 1.5; fill: none; }
    .purple rect { fill: #3c3489; stroke: #afa9ec; }
    .purple .th { fill: #cecbf6; } .purple .ts { fill: #afa9ec; }
    .teal rect { fill: #085041; stroke: #5dcaa5; }
    .teal .th { fill: #9fe1cb; } .teal .ts { fill: #5dcaa5; }
    .amber rect { fill: #633806; stroke: #ef9f27; }
    .amber .th { fill: #fac775; } .amber .ts { fill: #ef9f27; }
    .gray rect { fill: #444441; stroke: #b4b2a9; }
    .gray .th { fill: #d3d1c7; } .gray .ts { fill: #b4b2a9; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="490" fill="#0d0d0d"/>

  <text class="lab" x="18" y="36">Supply 1: power bank, logic only</text>
  <text class="lab" x="18" y="176">Fed by both supplies</text>
  <text class="lab" x="18" y="316">Supply 2: 18650 pack, power</text>

  <g class="purple">
    <rect x="18" y="50" width="116" height="64" rx="8" stroke-width="1"/>
    <text class="th" x="76" y="76" text-anchor="middle">Power bank</text>
    <text class="ts" x="76" y="96" text-anchor="middle">5V USB only</text>
  </g>
  <g class="purple">
    <rect x="282" y="50" width="116" height="64" rx="8" stroke-width="1"/>
    <text class="th" x="340" y="76" text-anchor="middle">ESP32-S3</text>
    <text class="ts" x="340" y="96" text-anchor="middle">camera, sensors</text>
  </g>

  <g class="gray">
    <rect x="150" y="190" width="116" height="64" rx="8" stroke-width="1"/>
    <text class="th" x="208" y="216" text-anchor="middle">Servos</text>
    <text class="ts" x="208" y="236" text-anchor="middle">MG995, MG90S</text>
  </g>
  <g class="amber">
    <rect x="282" y="190" width="116" height="64" rx="8" stroke-width="1"/>
    <text class="th" x="340" y="216" text-anchor="middle">PCA9685</text>
    <text class="ts" x="340" y="236" text-anchor="middle">V+ cap 1000uF</text>
  </g>
  <g class="amber">
    <rect x="414" y="190" width="116" height="64" rx="8" stroke-width="1"/>
    <text class="th" x="472" y="216" text-anchor="middle">Motor driver</text>
    <text class="ts" x="472" y="236" text-anchor="middle">cap 470uF</text>
  </g>
  <g class="gray">
    <rect x="546" y="190" width="116" height="64" rx="8" stroke-width="1"/>
    <text class="th" x="604" y="216" text-anchor="middle">Drive motors</text>
    <text class="ts" x="604" y="236" text-anchor="middle">100nF each</text>
  </g>

  <g class="teal">
    <rect x="18" y="330" width="116" height="64" rx="8" stroke-width="1"/>
    <text class="th" x="76" y="356" text-anchor="middle">2x 18650</text>
    <text class="ts" x="76" y="376" text-anchor="middle">2S, 7.4V</text>
  </g>
  <g class="teal">
    <rect x="150" y="330" width="116" height="64" rx="8" stroke-width="1"/>
    <text class="th" x="208" y="356" text-anchor="middle">Protection</text>
    <text class="ts" x="208" y="376" text-anchor="middle">BMS, 10A fuse</text>
  </g>
  <g class="teal">
    <rect x="282" y="330" width="116" height="64" rx="8" stroke-width="1"/>
    <text class="th" x="340" y="356" text-anchor="middle">Buck 6.0V</text>
    <text class="ts" x="340" y="376" text-anchor="middle">5A or more</text>
  </g>

  <line class="arr" x1="136" y1="82" x2="280" y2="82" marker-end="url(#arrow)"/>
  <text class="lab" x="208" y="74" text-anchor="middle">5V USB</text>

  <line class="arr" x1="310" y1="116" x2="310" y2="188" marker-end="url(#arrow)"/>
  <text class="lab" x="318" y="156">I2C</text>

  <path class="arr" d="M370 116 V150 H472 V188" marker-end="url(#arrow)"/>
  <text class="lab" x="421" y="168" text-anchor="middle">PWM + direction</text>

  <line class="arr" x1="280" y1="222" x2="268" y2="222" marker-end="url(#arrow)"/>
  <line class="arr" x1="532" y1="222" x2="544" y2="222" marker-end="url(#arrow)"/>

  <line class="arr" x1="136" y1="362" x2="148" y2="362" marker-end="url(#arrow)"/>
  <line class="arr" x1="268" y1="362" x2="280" y2="362" marker-end="url(#arrow)"/>

  <line class="arr" x1="340" y1="328" x2="340" y2="256" marker-end="url(#arrow)"/>
  <text class="lab" x="348" y="296">6.0V servo rail</text>

  <path class="arr" d="M208 396 V430 H472 V256" marker-end="url(#arrow)"/>
  <text class="lab" x="340" y="422" text-anchor="middle">7.4V to the driver</text>

  <path d="M18 82 H10 V362 H18" fill="none" stroke="#ef9f27" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="lab" x="340" y="466" text-anchor="middle">Bank ground and pack ground join at one point, and every board's ground goes to it.</text>
</svg>
