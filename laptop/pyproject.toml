[project]
name = "still-here-laptop"
version = "0.1.0"
description = "Vision, planner and API server for the STILL HERE rescue rover"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-contrib-python>=4.8",
    "fastapi>=0.110",
    "uvicorn[standard]",
    "websockets>=14",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "httpx2"]
firmware = ["platformio", "esptool", "pyserial"]

[tool.setuptools]
py-modules = ["aruco", "autopilot", "blender_camera", "blender_link", "calibrate", "demo_world", "experience", "grip_watch", "gyro_map", "manual_core", "marker_sheet", "models", "operator_core", "origin_guard", "person_detector", "plan_message", "planner", "report", "route", "rover_link", "scale", "scenario_runner", "scene", "scene_watch", "serial_camera", "server", "sim_rover", "sim_server", "snapshot_client", "snapshot_protocol", "stream", "trial_log", "vision"]

[tool.pytest.ini_options]
testpaths = ["."]
