[project]
name = "still-here-laptop"
version = "0.1.0"
description = "Vision, planner and API server for the STILL HERE rescue rover"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-contrib-python",
    "fastapi",
    "uvicorn[standard]",
    "websockets",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "httpx2"]
firmware = ["platformio", "esptool", "pyserial"]

[tool.setuptools]
py-modules = ["aruco", "gyro_map", "models", "operator_core", "origin_guard", "planner", "route", "scale", "scene", "server", "sim_rover", "stream", "vision"]

[tool.pytest.ini_options]
testpaths = ["."]
