# Copy to config.toml (git-ignored) and edit.

[rover]
host = "192.168.0.50"      # IP the ESP32 gets on the phone hotspot
ws_port = 81
stream_path = "/stream"

[blocks]
size_mm = 40               # the blocks are 40 mm cubes
marker_mm = 30             # printed side of the ArUco marker on a block face (must fit on the block)
heavy_marker_ids = [9]     # markers that mean "heavy / load-bearing"
top_marker_ids = [5, 6, 7, 8]  # markers on top-layer blocks; every other id is a bottom block

[buggy]
breadth_mm = 200           # official width of the buggy
length_mm = 475            # official length is between 450 and 500: measure yours
clearance_mm = 20          # spare room each side, so the path planner needs breadth + 2 x this

[survivor_light]
pulse_hz = 1.5             # expected pulse rate of the survivor LED

[test]
max_shift_mm = 5           # bottom block must move less than this
max_rotation_deg = 10      # and rotate less than this
